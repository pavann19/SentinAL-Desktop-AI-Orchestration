[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=agentic_core --cov=system_services --cov=config --cov=capabilities --cov=interfaces --cov-report=term-missing --cov-report=html:htmlcov --cov-config=.coveragerc
asyncio_mode = auto
