name: SentinAL CI

on:
  push:
    branches: [main, develop, "phase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SENTINAL_DEBUG: "false"
  SENTINAL_UI_PORT: "5173"
  TASK_QUEUE_MAX: "20"
  SESSION_TIMEOUT: "15"
  TAVILY_API_KEY: ""
  GROQ_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  LLM_PROVIDER: "local"
  EXECUTOR_STEP_DELAY: "0"
  GUI_FOCUS_WAIT: "0"

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -p test_ci_gate.py

  lint:
    name: Static analysis
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff==0.16.0 mypy
      # Existing broad-catch exceptions remain explicit; no new ignores are added.
      - run: python -m ruff check agentic_core/ system_services/ config/ capabilities/ interfaces/ --ignore E501,E402,BLE001,S110,S112
      - run: python -m mypy agentic_core/validator.py agentic_core/memory_hook.py system_services/privacy_router.py --ignore-missing-imports

  test:
    name: Unit and integration coverage
    runs-on: windows-latest
    needs: [repository, lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime data
        shell: pwsh
        run: '"SENTINAL_DATA_DIR=$env:RUNNER_TEMP/sentinal-ci" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov pytest-asyncio anyio
      # Model and voice suites retain the existing exclusions; see CONTRIBUTING.md.
      - name: Run regression with the existing 70 percent coverage threshold
        run: python -m pytest tests/ --ignore=tests/test_stress.py --ignore=tests/test_router.py --ignore=tests/test_stt_service.py --ignore=tests/test_wake_intelligence.py --ignore=tests/test_tts_service.py -v --tb=short --cov=agentic_core --cov=system_services --cov=config --cov=capabilities --cov=interfaces --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=70 --junitxml=test-results/regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            coverage.xml
            htmlcov/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security regression
    runs-on: windows-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime data
        shell: pwsh
        run: '"SENTINAL_DATA_DIR=$env:RUNNER_TEMP/sentinal-ci" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest-asyncio pytest-cov
      - run: python -m pytest tests/test_security_fuzz.py -v --tb=short --no-cov

  stress:
    name: Stress and concurrency
    runs-on: windows-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime data
        shell: pwsh
        run: '"SENTINAL_DATA_DIR=$env:RUNNER_TEMP/sentinal-ci" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest-asyncio pytest-timeout pytest-cov
      - run: python -m pytest tests/test_stress.py -v --tb=short --timeout=60 --no-cov

  integration:
    name: Pipeline integration
    runs-on: windows-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime data
        shell: pwsh
        run: '"SENTINAL_DATA_DIR=$env:RUNNER_TEMP/sentinal-ci" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest-asyncio pytest-cov
      - run: python -m pytest tests/test_pipeline_integration.py tests/test_api_wrapper.py -v --tb=short --no-cov

  ui:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: sentinal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinal-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gate:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [repository, lint, test, security, stress, integration, ui]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require every dependency to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_gate.py
