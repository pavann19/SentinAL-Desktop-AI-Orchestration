name: SentinAL Phase 1 — CI/CD Test Pipeline

on:
  push:
    branches: [ main, develop, "phase-*" ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  SENTINAL_DEBUG: "false"
  SENTINAL_UI_PORT: "5173"
  TASK_QUEUE_MAX: "20"
  SESSION_TIMEOUT: "15"
  TAVILY_API_KEY: ""       # Empty in CI — search tests use mocks
  GROQ_API_KEY: ""         # Empty in CI — LLM tests use mocks
  LLM_PROVIDER: "local"
  EXECUTOR_STEP_DELAY: "0"
  GUI_FOCUS_WAIT: "0"

jobs:
  # ── Job 1: Static Analysis ────────────────────────────────────────────────
  lint:
    name: "Static Analysis (ruff + mypy)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff (fast linter)
        run: ruff check agentic_core/ system_services/ config/ capabilities/ interfaces/ --ignore E501,E402

      - name: Run mypy (type checking)
        run: mypy agentic_core/validator.py agentic_core/memory_hook.py system_services/privacy_router.py --ignore-missing-imports
        continue-on-error: true  # Type errors are warnings, not blockers

  # ── Job 2: Unit + Integration Tests ──────────────────────────────────────
  test:
    name: "Unit + Integration Tests (90% Coverage)"
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio anyio
          pip install langchain langchain-core langchain-ollama langchain-groq
          pip install sentence-transformers scikit-learn numpy
          pip install fastapi uvicorn starlette pydantic
          pip install python-dotenv psutil
          pip install tavily-python

      - name: Run unit + integration tests (excludes stress)
        run: |
          pytest tests/ --ignore=tests/test_stress.py --ignore=tests/test_router.py ^
            --ignore=tests/test_stt_service.py --ignore=tests/test_wake_intelligence.py ^
            --ignore=tests/test_tts_service.py ^
            -v --tb=short ^
            --cov=agentic_core --cov=system_services --cov=config --cov=capabilities ^
            --cov-report=term-missing --cov-report=xml:coverage.xml ^
            --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: htmlcov/

  # ── Job 3: Security Fuzz Tests ────────────────────────────────────────────
  security:
    name: "Security Fuzz Tests"
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install langchain langchain-core langchain-ollama python-dotenv
          pip install sentence-transformers scikit-learn numpy

      - name: Run security fuzz tests (zero tolerance — must all pass)
        run: pytest tests/test_security_fuzz.py -v --tb=short

  # ── Job 4: Stress Tests ───────────────────────────────────────────────────
  stress:
    name: "Stress + Concurrency Tests"
    runs-on: windows-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-timeout
          pip install langchain langchain-core langchain-ollama python-dotenv
          pip install sentence-transformers scikit-learn numpy

      - name: Run stress and concurrency tests
        run: pytest tests/test_stress.py -v --tb=short --timeout=60

  # ── Job 5: Pipeline Integration Tests ─────────────────────────────────────
  integration:
    name: "Pipeline Integration Tests"
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install langchain langchain-core langchain-ollama python-dotenv
          pip install sentence-transformers scikit-learn numpy psutil

      - name: Run pipeline integration tests
        run: pytest tests/test_pipeline_integration.py tests/test_api_wrapper.py -v --tb=short

  # ── Job 6: Final Gate — All Tests Must Pass ───────────────────────────────
  gate:
    name: "🚦 Final Gate — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [lint, test, security, stress, integration]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" || \
                "${{ needs.stress.result }}" == "failure" || \
                "${{ needs.integration.result }}" == "failure" ]]; then
            echo "❌ CI FAILED — One or more test suites failed."
            exit 1
          else
            echo "✅ All CI checks passed. Phase 1 is green."
          fi
