name: Release verification

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  SENTINAL_DEBUG: "false"
  LLM_PROVIDER: local
  GROQ_API_KEY: ""
  TAVILY_API_KEY: ""
  EXECUTOR_STEP_DELAY: "0"
  GUI_FOCUS_WAIT: "0"

jobs:
  python:
    name: Windows tests, 70% scoped coverage, lint and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and development tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Audit installed release dependencies
        run: python scripts/audit_dependencies.py
      - name: Runtime lint
        run: python -m ruff check main.py agentic_core system_services config capabilities interfaces scripts/check_release.py scripts/audit_dependencies.py --ignore E501,E402,BLE001,S110,S112
      - name: Type-check security modules
        run: python -m mypy --explicit-package-bases --follow-imports=silent agentic_core/execution_authority.py agentic_core/capability_broker.py agentic_core/confirmation.py agentic_core/executor.py capabilities/system/api_wrapper.py config/capability_tiers.py agentic_core/validator.py agentic_core/memory_hook.py system_services/privacy_router.py --ignore-missing-imports
      - name: Validate release source and links
        run: python scripts/check_release.py
      - name: Authorization and trusted-verification regressions
        run: python -m pytest tests/test_execution_authority.py tests/test_shared_transport.py tests/test_websocket_auth.py --no-cov --timeout=60
      - name: Complete test suite, including router, voice mocks, security and stress
        run: python -m pytest tests/ --timeout=60 --cov-report=xml:coverage.xml --cov-fail-under=70
      - name: Focused offline pipeline evaluation
        env:
          SENTINAL_OFFLINE: "1"
        run: python -m eval.run_eval --run-id ci --task-id conv-hello --task-id deny-format --task-id deny-format-d-drive
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate wheel contents
        shell: bash
        run: |
          python -c "import glob,zipfile; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'main.py' in names; assert 'interfaces/voice/stt_service.py' in names; assert not any(n.startswith(('data/','_evidence/','thesis/')) for n in names)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            coverage.xml
            dist/*.whl
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Browser HUD lint, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sentinal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinal-ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm audit --audit-level=moderate

  docker:
    name: Headless evaluation image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinal-eval .
      - name: Image import and source-data smoke check
        run: docker run --rm sentinal-eval python -c "import json; import eval.finetune_classifier; import agentic_core.embedding_backend; assert len(json.load(open('eval/intent_dataset.json'))) == 3230"

  gate:
    name: All required checks succeeded
    runs-on: ubuntu-latest
    needs: [python, frontend, docker]
    if: always()
    steps:
      - name: Reject failure, cancellation and skipped dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in jobs.values()), jobs'
