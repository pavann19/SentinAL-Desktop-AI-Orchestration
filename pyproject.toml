[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinal"
version = "9.0.0"
description = "Supervised Windows desktop orchestration with deterministic action authorization."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gannoju Pavan Kumar", email = "pavangannoju.germany@gmail.com" },
]
keywords = ["ai-agent", "llm-security", "voice-assistant", "prompt-injection", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Canonical runtime dependency ranges; requirements.txt mirrors this list.
dependencies = [
    "fastapi>=0.142.2,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "starlette>=1.3.1,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "langchain>=1.3.9,<2.0.0",
    "langchain-core>=1.3.3,<2.0.0",
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-groq>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "sentence-transformers>=5.6.0,<7.0.0",
    "torch>=2.13.0,<3.0.0",
    "transformers>=5.10.0,<6.0.0",
    "scikit-learn==1.8.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "dateparser>=1.2.0,<2.0.0",
    "faster-whisper>=1.0.0,<2.0.0",
    "sounddevice>=0.4.7,<1.0.0",
    "soundfile>=0.12.1,<1.0.0",
    "numpy>=2.0.2,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.18.0,<2.0.0",
    "fastembed>=0.4.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cachetools>=5.3.0,<6.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyautogui>=0.9.54,<1.0.0",
    "pygetwindow>=0.0.9,<1.0.0; sys_platform == \"win32\"",
    "pywinauto>=0.6.9,<1.0.0; sys_platform == \"win32\"",
    "pillow>=12.3.0,<13.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "tavily-python>=0.3.0,<1.0.0",
    "pvporcupine>=3.0.0,<4.0.0"
]

[project.optional-dependencies]
# Development tools for the Windows test suite.
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "build>=1.2",
    "pip-audit>=2.9",
    "httpx>=0.27",
    "ruff==0.16.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/pavann19/SentinAL-Desktop-AI-Orchestration"

[project.scripts]
sentinal = "main:__main_entry__"

[tool.setuptools]
py-modules = ["main"]
# This is an application, not a conventional importable library — the packages
# below are the runtime modules, discovered explicitly rather than via flat
# auto-discovery (which would sweep in tests/, eval/, and scratch dirs).
packages = [
    "agentic_core",
    "capabilities",
    "capabilities.system",
    "capabilities.developer",
    "capabilities.web",
    "system_services",
    "config",
    "interfaces",
    "interfaces.ui_bridge",
    "interfaces.voice",
]

# Pytest config lives in pytest.ini (includes coverage settings pytest.ini_options
# would duplicate incompletely) — not repeated here to avoid the two drifting apart.

[tool.ruff]
line-length = 120
