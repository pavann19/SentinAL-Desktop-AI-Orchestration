[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinal"
version = "9.0.0"
description = "Secure AI Desktop Orchestration — a voice-controlled desktop agent with a deterministic security and privacy governance layer."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Gannoju Pavan Kumar", email = "pavangannoju.germany@gmail.com" },
]
keywords = ["ai-agent", "llm-security", "voice-assistant", "prompt-injection", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dynamic = ["dependencies"]

[project.optional-dependencies]
# Development tools supplement the Windows runtime dependencies.
# The headless evaluation image uses requirements-eval.txt instead.
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff==0.16.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/pavann19/SentinAL-Desktop-AI-Orchestration"
Issues = "https://github.com/pavann19/SentinAL-Desktop-AI-Orchestration/issues"

[project.scripts]
sentinal = "main:__main_entry__"

[tool.setuptools]
py-modules = ["main"]
# This is an application, not a conventional importable library — the packages
# below are the runtime modules, discovered explicitly rather than via flat
# auto-discovery (which would sweep in tests/, eval/, and scratch dirs).
packages = [
    "agentic_core",
    "capabilities",
    "capabilities.system",
    "capabilities.developer",
    "capabilities.web",
    "system_services",
    "config",
    "interfaces",
    "interfaces.ui_bridge",
    "interfaces.voice",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Pytest config lives in pytest.ini (includes coverage settings pytest.ini_options
# would duplicate incompletely) — not repeated here to avoid the two drifting apart.

[tool.ruff]
line-length = 120
