[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinal"
version = "9.0.0"
description = "Secure AI Desktop Orchestration — a voice-controlled desktop agent with a deterministic security and privacy governance layer."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Gannoju Pavan Kumar", email = "pavangannoju.germany@gmail.com" },
]
keywords = ["ai-agent", "llm-security", "voice-assistant", "prompt-injection", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Runtime dependencies. Kept in sync with requirements.txt, which remains the
# canonical pinned lockfile used by CI and the Docker image.
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "starlette>=0.37.0,<1.0.0",
    "langchain>=0.2.0,<0.3.0",
    "langchain-core>=0.2.0,<0.3.0",
    "langchain-ollama>=0.1.0,<0.2.0",
    "langchain-groq>=0.1.0,<0.2.0",
    "langgraph>=0.1.0,<0.2.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    # NOTE: the committed classifier (classifier_v1.joblib) is pickled under the
    # scikit-learn version this range currently resolves to. Across a major
    # scikit-learn line, an unpickle warning or failure is possible — regenerate
    # with `python -m eval.finetune_classifier --run-id local` if that occurs.
    # The training code itself is compatible across 1.5–1.8 (the removed
    # `multi_class` argument is no longer passed).
    "scikit-learn>=1.5.0,<2.0.0",
    "faster-whisper>=1.0.0,<2.0.0",
    "sounddevice>=0.4.7,<1.0.0",
    "soundfile>=0.12.1,<1.0.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.18.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cachetools>=5.3.0,<6.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyautogui>=0.9.54,<1.0.0",
    "pillow>=10.3.0,<11.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "tavily-python>=0.3.0,<1.0.0",
    "pvporcupine>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
# Headless verification surface — router, validator, evaluation, and the test
# suite. Installable on Linux/CI without the GUI/voice runtime. This is what the
# Docker image installs (see Dockerfile).
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/pavann19"

[project.scripts]
sentinal = "main:__main_entry__"

[tool.setuptools]
# This is an application, not a conventional importable library — the packages
# below are the runtime modules, discovered explicitly rather than via flat
# auto-discovery (which would sweep in tests/, eval/, and scratch dirs).
packages = [
    "agentic_core",
    "capabilities",
    "capabilities.system",
    "capabilities.developer",
    "capabilities.web",
    "system_services",
    "config",
    "interfaces",
    "interfaces.ui_bridge",
]

# Pytest config lives in pytest.ini (includes coverage settings pytest.ini_options
# would duplicate incompletely) — not repeated here to avoid the two drifting apart.

[tool.ruff]
line-length = 120
